<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title if title else "Churn BI Platform" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Churn Platform</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Predict</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-muted small">
    FastAPI + CatBoost + Optuna + SHAP + Prometheus + Docker + CI
  </footer>
</body>
</html>
